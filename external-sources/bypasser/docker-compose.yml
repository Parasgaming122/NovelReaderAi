# ══════════════════════════════════════════════════════════════
#   Docker Compose for TRAWL (Cloudflare Bypass Server)
#   
#   Usage:
#     docker compose up -d
#     
#   Then configure bypasser/config.lua to point to:
#     trawl_url = "http://localhost:8191"
# ══════════════════════════════════════════════════════════════

version: '3.8'

services:
  trawl:
    image: ghcr.io/germondai/trawl:latest
    container_name: novel-trawl
    restart: unless-stopped
    ports:
      - "8191:8191"    # API port (FlareSolverr-compatible)
      # - "8192:8192"  # MITM proxy (optional, enable in .env)
    environment:
      - PORT=8191
      - BROWSER_POOL_SIZE=3
      - SESSION_TTL_SECONDS=3600
      # - RESIDENTIAL_PROXY_URL=http://user:pass@proxy:port  # Optional Tier 4
      # - MITM_PROXY_ENABLED=false  # Enable for fingerprint-bound CF sites
      # - MITM_PROXY_PORT=8192
    volumes:
      - trawl-data:/data  # Persist session data (optional)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis (optional but recommended for session caching)
  redis:
    image: redis:8-alpine
    container_name: novel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  trawl-data:
    driver: local
  redis-data:
    driver: local

networks:
  default:
    name: novel-bypass-network
