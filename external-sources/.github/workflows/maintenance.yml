# Scheduled Maintenance Workflow
# ==================================
# Runs weekly to:
# - Check source health (are sites still up?)
# - Update bypasser config if needed
# - Generate statistics
# - Clean up old cache files

name: Maintenance

on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  health-check:
    name: 🏥 Source Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source URLs
        run: |
          echo "🏥 Checking source health..."
          
          # Extract all baseUrl values from sources
          grep -rh "baseUrl\s*=" --include="*.lua" . | \
            grep -oP 'https?://[^"]+' | \
            sort -u > /tmp/source_urls.txt
          
          TOTAL=$(wc -l < /tmp/source_urls.txt)
          WORKING=0
          BROKEN=0
          
          echo "Checking $TOTAL unique base URLs..."
          echo ""
          
          while read url; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" || echo "000")
              
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
                  WORKING=$((WORKING + 1))
              else
                  BROKEN=$((BROKEN + 1))
                  echo "⚠️  $url → HTTP $STATUS"
              fi
          done < /tmp/source_urls.txt
          
          echo ""
          echo "=============================="
          echo "Total URLs: $TOTAL"
          echo "Working: $WORKING"
          echo "Broken: $BROKEN"
          
          # Save results
          echo "## Health Check Results ($(date +'%Y-%m-%d'))" > $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total URLs | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Working | $WORKING |" >> $GITHUB_STEP_SUMMARY
          echo "| Broken | $BROKEN |" >> $GITHUB_STEP_SUMMARY

  stats:
    name: 📊 Generate Statistics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate repository stats
        run: |
          cd external-sources || cd .
          
          echo "📊 Repository Statistics"
          echo "========================="
          echo ""
          
          # Count by language
          echo "Sources by Language:"
          for dir in zh en ja ru id pt fr ar mtl; do
              if [ -d "$dir" ]; then
                  COUNT=$(ls -1 "$dir"/*.lua 2>/dev/null | wc -l)
                  printf "  %-10s %d sources\n" "$(echo $dir | tr '[:lower:]' '[:upper:]'):" "$COUNT"
              fi
          done
          
          echo ""
          
          # Bypass coverage
          BYPASS_COUNT=$(grep -rl 'require("bypasser")' . --include="*.lua" 2>/dev/null | wc -l)
          TOTAL_LUA=$(find . -name "*.lua" -not -path "./bypasser/*" | wc -l)
          
          echo "Bypass Coverage:"
          echo "  Sources with bypass: $BYPASS_COUNT"
          echo "  Total sources: $TOTAL_LUA"
          echo "  Coverage: $(echo "scale=1; $BYPASS_COUNT * 100 / $TOTAL_LUA" | bc)%"
          
          echo ""
          
          # File sizes
          echo "Module Sizes:"
          for file in bypasser/*.lua; do
              if [ -f "$file" ]; then
                  SIZE=$(du -h "$file" | cut -f1)
                  LINES=$(wc -l < "$file")
                  printf "  %-20s %s (%d lines)\n" "$(basename $file):" "$SIZE" "$LINES"
              fi
          done
          
          # Save to summary
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "Sources with bypass: $BYPASS_COUNT/$TOTAL_LUA" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  cleanup:
    name: 🧹 Cleanup Old Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Report artifact status
        run: |
          echo "🧹 Cleanup Information"
          echo "====================="
          echo ""
          echo "GitHub Actions artifacts are auto-cleaned after:"
          echo "- Release packages: 30 days retention"
          echo "- Test results: 7 days retention"
          echo ""
          echo "No manual cleanup needed."

  # Create issue if many broken sources found
  issue-on-failure:
    name: 📝 Create Issue if Needed
    needs: health-check
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue for broken sources
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🔴 Source Health Check Failed - ${new Date().toISOString().split('T')[0]}`;
            
            const body = `
            ## Source Health Check Failed
            
            The scheduled health check detected issues with some source URLs.
            
            ### Action Required
            - Review the failing URLs below
            - Update or remove broken sources
            - Consider adding alternative sources
            
            ### Details
            - **Check Date:** ${new Date().toISOString()}
            - **Workflow Run:** [View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ---
            
            *This issue was automatically created by the maintenance workflow.*
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['maintenance', 'health-check']
            });
