# PR/Issue Automation
# =====================
# - Welcome new contributors
# - Auto-label issues/PRs
# - Add PR checklist comment

name: PR & Issue Automation

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, synchronize]
  pull_request:
    types: [opened, synchronize]

jobs:
  # Welcome message for first-time contributors
  welcome:
    name: 👋 Welcome New Contributors
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' || github.event_name == 'pull_request'
    steps:
      - name: Check if first-time contributor
        id: check
        env:
          AUTHOR: ${{ github.actor }}
        run: |
          # This is a simplified check - in real scenario you'd query the API
          echo "first_time=true" >> $GITHUB_OUTPUT

      - name: Post welcome comment
        if: steps.check.outputs.first_time == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `
            ## 👋 Welcome, @${{ github.actor }}!
            
            Thanks for contributing to NovelDokusha External Sources! 🎉
            
            ### Quick Checklist
            
            Before merging, please ensure:
            
            - [ ] **Source works** - Test that chapters load correctly
            - [ ] **Bypass integration** - Include \`require("bypasser")\` if site has CF protection
            - [ ] **Metadata complete** - All required fields (id, name, version, baseUrl, language)
            - [ ] **No errors** - No \`attempt to call nil\` or similar runtime errors
            - [ ] **Clean code** - Remove debug prints before submitting
            
            ### Testing Your Source
            
            1. Place your \`.lua\` file in the appropriate language folder (\`zh/\`, \`en/\`, etc.)
            2. Import into NovelDokusha app
            3. Test search, chapter list, and chapter text loading
            4. Verify bypasser is working (check logs for "[source] ✓ Bypass loaded")
            
            ### Questions?
            
            Check out our [README](../blob/main/bypasser/README.md) for bypass documentation.
            
            ---
            
            *This is an automated response. A maintainer will review your PR soon!*
            `;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  # Auto-label based on content
  auto-label:
    name: 🏷️ Auto-Label
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' || github.event_name == 'pull_request'
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Checkout for analysis
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine labels
        id: labels
        run: |
          LABELS=""
          
          # Get changed files for PRs
          if [ "${{ github.event_name }}" = "pull_request" ]; then
              FILES=$(git diff --name-only ${{ github.base_ref }} ${{ github.head_ref }} 2>/dev/null || echo "")
              
              # Language-specific labels
              if echo "$FILES" | grep -q "^zh/"; then LABELS="$LABELS,🇨🇳 chinese"; fi
              if echo "$FILES" | grep -q "^en/"; then LABELS="$LABELS,🇬🇧 english"; fi
              if echo "$FILES" | grep -q "^ja/"; then LABELS="$LABELS,🇯🇵 japanese"; fi
              if echo "$FILES" | grep -q "^ru/"; then LABELS="$LABELS,🇷🇺 russian"; fi
              if echo "$FILES" | grep -q "^id/"; then LABELS="$LABELS,🇮🇩 indonesian"; fi
              
              # Component labels
              if echo "$FILES" | grep -q "bypasser/"; then LABELS="$LABELS,⛅ bypass"; fi
              if echo "$FILES" | grep -q "\.github/"; then LABELS="$LABELS,🔧 ci/cd"; fi
          fi
          
          # Issue-specific labels
          if [ "${{ github.event_name }}" = 'issues' ]; then
              TITLE="${{ github.event.issue.title }}"
              BODY="${{ github.event.issue.body }}"
              
              if echo "$TITLE $BODY" | grep -qi "bug\|error\|not working"; then
                  LABELS="$LABELS,🐛 bug"
              elif echo "$TITLE $BODY" | grep -qi "new source\|add.*source"; then
                  LABELS="$LABELS,✨ enhancement"
              elif echo "$TITLE $BODY" | grep -qi "cloudflare\|bypass\|blocked"; then
                  LABELS="$LABELS,☁️ cloudflare"
              fi
          fi
          
          # Remove leading comma
          LABELS=$(echo "$LABELS" | sed 's/^,//')
          echo "labels=$LABELS" >> $GITHUB_OUTPUT

      - name: Apply labels
        if: steps.labels.outputs.labels != ''
        uses: actions/github-script@v7
        with:
          script: |
            const labels = "${{ steps.labels.outputs.labels }}".split(',').filter(l => l.trim() !== '');
            
            if (context.eventName === 'pull_request') {
                await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    labels: labels
                });
            } else {
                await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    labels: labels
                });
            }

  # Validate PR changes
  validate-pr:
    name: ✅ Validate PR Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for common issues
        run: |
          echo "🔍 Checking PR for common issues..."
          ISSUES=""
          
          # Check for syntax errors in changed files
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- '*.lua')
          
          for file in $CHANGED_FILES; do
              if [ -f "$file" ]; then
                  # Basic Lua syntax check (look for obvious issues)
                  if grep -q 'regex_replace(' "$file"; then
                      ISSUES="$ISSUES\n⚠️  $file uses regex_replace (may not work)"
                  fi
                  
                  if grep -q 'html_remove(' "$file"; then
                      ISSUES="$ISSUES\n⚠️  $file uses html_remove"
                  fi
                  
                  # Check for missing bypass in zh/en sources
                  if [[ "$file" =~ ^(zh|en)/ ]] && ! grep -q 'require("bypasser")' "$file"; then
                      ISSUES="$ISSUES\nℹ️  $file missing bypass integration"
                  fi
              fi
          done
          
          if [ -n "$ISSUES" ]; then
              echo "Found potential issues:"
              echo -e "$ISSUES"
              echo ""
              echo "::warning::Review warnings above"
          else
              echo "✅ No common issues found!"
          fi

  # Stale issue/PR cleanup reminder
  stale-check:
    name: 📅 Check for Stale Items
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' || github.event_name == 'pull_request'
    steps:
      - name: Comment on old items
        if: github.event.issue.created_at < fromJSON('2024-01-01T00:00:00Z')
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const body = `
            👋 Just checking in!
            
            This ${context.eventName === 'pull_request' ? 'PR' : 'issue'} has been open for a while.
            Is it still relevant? 
            
            If so, please add a comment to let us know.
            If not, feel free to close it.
            
            Thanks! 🙏
            `;
            
            // Only comment once per item
            const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
            });
            
            const alreadyCommented = comments.data.some(c => 
                c.user.type === 'Bot' && c.body.includes('Just checking in')
            );
            
            if (!alreadyCommented) {
                await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    body: body
                });
            }
