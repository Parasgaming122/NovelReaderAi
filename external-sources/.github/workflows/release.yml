# Release Workflow - Auto-publish ZIP packages
# ================================================
# Creates and publishes ZIP package on:
# - Version tags (v*)
# - Manual trigger
# - Schedule (weekly)

name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 2.1.0)'
        required: false
        default: 'manual'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Job 1: Build the package
  build:
    name: 📦 Build Package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      filename: ${{ steps.build.outputs.filename }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Extract version from tag (remove 'v' prefix)
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [ -n "${{ inputs.version }}" ] && [ "${{ inputs.version }}" != "manual" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Generate version from date
            VERSION="$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📌 Version: $VERSION"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build ZIP package
        id: build
        run: |
          cd external-sources || true
          
          FILENAME="novel-sources-bypasser-v${{ steps.version.outputs.version }}.zip"
          
          echo "📦 Building: $FILENAME"
          
          # Create ZIP with proper structure
          zip -r "../$FILENAME" \
            bypasser/ \
            zh/ en/ ja/ ru/ id/ pt/ fr/ ar/ mtl/ \
            icons/ \
            index.yaml \
            README.md \
            -x "*.pyc" "*/\.*" "*__pycache__/*"
          
          # Get file size
          SIZE=$(du -h "../$FILENAME" | cut -f1)
          
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo ""
          echo "✅ Package created: $FILENAME ($SIZE)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: ${{ steps.build.outputs.filename }}
          retention-days: 30

  # Job 2: Create GitHub Release
  release:
    name: 🚀 Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package

      - name: Generate changelog
        id: changelog
        run: |
          # Get recent commits for changelog
          CHANGELOG=$(git log --oneline --since="7 days ago" | head -20 || echo "Initial release")
          
          # Count sources
          LUA_COUNT=$(find . -name "*.lua" -not -path "./.git/*" | wc -l)
          BYPASS_COUNT=$(grep -rl 'require("bypasser")' . --include="*.lua" 2>/dev/null | wc -l)
          
          cat > RELEASE_NOTES.md << EOF
          ## NovelDokusha External Sources v${{ needs.build.outputs.version }}
          
          ### 📦 Package Contents
          - **$LUA_COUNT** Lua source files
          - **$BYPASS_COUNT** sources with Cloudflare bypass support
          - **4-tier** bypass architecture (standalone, no server needed!)
          
          ### 🛡️ Bypass Features
          - ✅ Tier 1: Browser-like HTTP emulation (<200ms)
          - ✅ Tier 2: Cached session replay (~300ms)
          - ✅ Tier 3: Enhanced retry with rotation (3-12s)
          - ✅ Tier 4: Best-effort fallback
          
          ### 📋 Supported Languages
          - 🇨🇳 Chinese (24 sources)
          - 🇬🇧 English (38 sources)
          - 🇯🇵 Japanese (2 sources)
          - 🇷🇺 Russian (5 sources)
          - 🇮🇩 Indonesian (11 sources)
          - 🇵🇹 Portuguese, 🇫🇷 French, 🇸🇦 Arabic, MTL
          
          ### 🚀 Installation
          1. Download this ZIP
          2. Extract to get \`external-sources/\` folder
          3. Copy to NovelDokusha app directory
          4. Restart app
          
          ---
          
          ### Recent Changes
          $CHANGELOG
          EOF
          
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ needs.build.outputs.version }}"
          body_path: RELEASE_NOTES.md
          files: |
            ${{ needs.build.outputs.filename }}
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 3: Update latest release (always points to newest)
  update-latest:
    name: 🔄 Update Latest
    needs: [build, release]
    if: always() && needs.release.result == 'success' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Latest Development Build"
          body: |
            ## Latest Development Build
            
            **Version:** `${{ needs.build.outputs.version }}`
            
            This is an automatically generated development build.
            For stable releases, check the [Releases page](../../releases).
            
            > ⚠️ Development builds may contain untested changes.
          files: |
            ${{ needs.build.outputs.filename }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Summary
  summary:
    name: ✅ Release Summary
    needs: [build, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print summary
        run: |
          echo "## Release Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ needs.build.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| File | \`${{ needs.build.outputs.filename }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Status | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Status | ${{ needs.release.result }} |" >> $GITHUB_STEP_SUMMARY
